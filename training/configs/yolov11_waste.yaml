# EcoVision AI — YOLOv11 Training Configuration
# ==============================================
# Run from the training/ directory in Google Colab:
#   from ultralytics import YOLO
#   model = YOLO('yolo11s.pt')
#   model.train(**config)

# ---- Data ----
data: ../data/dataset.yaml        # adjust path relative to Colab working dir

# ---- Model ----
model: yolo11s.pt                 # pretrained COCO weights (downloaded automatically)

# ---- Training hyperparameters ----
epochs: 100
imgsz: 640
batch: 16                         # reduce to 8 if GPU OOM on Colab T4
device: 0                         # GPU 0; set to 'cpu' for local testing only

# ---- Optimizer ----
optimizer: AdamW
lr0: 0.001
lrf: 0.01                         # final lr = lr0 * lrf
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

# ---- Augmentation ----
# Ultralytics applies these by default; tune if needed
hsv_h: 0.015                      # hue jitter
hsv_s: 0.7                        # saturation jitter
hsv_v: 0.4                        # value/brightness jitter
degrees: 0.0                      # rotation (set >0 for waste that can appear rotated)
translate: 0.1
scale: 0.5
flipud: 0.0
fliplr: 0.5
mosaic: 1.0                       # mosaic augmentation (4-image mix)
mixup: 0.1
copy_paste: 0.1

# ---- Output ----
project: runs/train
name: yolov11s_waste_v1
save: true
save_period: 5                    # save checkpoint every 5 epochs
patience: 20                      # early stopping patience (epochs without improvement)

# ---- Reproducibility ----
seed: 42
deterministic: true

# ---- Colab-specific ----
# workers: 2                      # reduce if DataLoader errors occur in Colab

# ---- Class weights (optional: add after audit reveals imbalance) ----
# cls: 0.5                        # classification loss weight
# box: 7.5                        # box regression loss weight

